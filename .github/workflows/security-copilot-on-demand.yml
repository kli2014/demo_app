name: Security Copilot On-Demand Trigger

# This workflow is triggered by PR review requests to perform on-demand security scans.
# Using pull_request_target with explicit author association check for security.

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-scan-on-label:
    name: Security Scan on Label
    runs-on: ubuntu-latest
    # Only run when the 'security-scan' label is added by maintainers
    if: github.event.label.name == 'security-scan'
    steps:
      - name: Check if labeler is authorized
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor
            });
            const authorized = ['admin', 'write'].includes(permission.permission);
            if (!authorized) {
              core.setFailed('Security scan can only be triggered by repository maintainers.');
              return;
            }
            core.setOutput('is_authorized', authorized);

      - name: Acknowledge scan request
        if: steps.check.outputs.is_authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 Security Copilot agent triggered. Running security analysis on the base branch with PR changes...'
            })

      - name: Checkout base branch
        if: steps.check.outputs.is_authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Initialize CodeQL
        if: steps.check.outputs.is_authorized == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ruby

      - name: Perform CodeQL Analysis
        if: steps.check.outputs.is_authorized == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:ruby"

      - name: Remove security-scan label
        if: always() && steps.check.outputs.is_authorized == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'security-scan'
              });
            } catch (e) {
              // Label may already be removed
            }

      - name: Report completion
        uses: actions/github-script@v7
        if: always() && steps.check.outputs.is_authorized == 'true'
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} Security Copilot analysis completed with status: ${{ job.status }}`
            })
